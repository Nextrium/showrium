name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
# Third-party actions are pinned to commit SHAs (supply-chain safety); Dependabot proposes updates.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  # Deploys after checks pass: main -> production (app.showrium.com),
  # develop -> preview (preview.showrium.com, its own Worker, database and secrets).
  # Database migrations run first; they are additive-only (ADR-0002), so the running Worker keeps working.
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [build, secret-scan]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      D1_NAME: ${{ github.ref == 'refs/heads/main' && 'showrium-db' || 'showrium-db-preview' }}
      APP_URL: ${{ github.ref == 'refs/heads/main' && 'https://app.showrium.com' || 'https://preview.showrium.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply "$D1_NAME" --remote --env "$TARGET"
      - name: Build
        working-directory: apps/web
        run: pnpm exec vite build
        env:
          CLOUDFLARE_ENV: ${{ env.TARGET }}
      - name: Deploy
        working-directory: apps/web
        run: pnpm exec wrangler deploy
      - name: Smoke test
        run: curl --fail --silent --retry 3 --retry-delay 5 "$APP_URL/api/v1/health"
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Free gitleaks CLI; the gitleaks GitHub Action needs a paid licence for organizations.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
