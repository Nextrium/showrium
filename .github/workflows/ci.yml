name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
# Third-party actions are pinned to commit SHAs (supply-chain safety); Dependabot proposes updates.
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  # Browser tests of the core flows (Playwright), on a local server with the fake AI and random
  # secrets: no real accounts, keys or costs. A broken flow blocks the deploy.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the test browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        working-directory: apps/web
        run: pnpm e2e
  # Data can't be lost: migrations may only add, and merged migrations are frozen (scripts/migration-guard.mjs).
  # Compared with the pull request's base, or with the commit before a push.
  migration-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/migration-guard.test.mjs
      - run: node scripts/migration-guard.mjs "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  # Deploys after checks pass: main -> production (app.showrium.com),
  # develop -> preview (preview.showrium.com, its own Worker, database and secrets).
  # Database migrations run first; they are additive-only (ADR-0002), so the running Worker keeps working.
  # The Cloudflare key lives in the GitHub environment ("preview" or "production"), which only releases
  # it to runs from its own branch; production also waits for an approver.
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: [build, e2e, secret-scan, migration-guard]
    runs-on: ubuntu-24.04
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      D1_NAME: ${{ github.ref == 'refs/heads/main' && 'showrium-db' || 'showrium-db-preview' }}
      APP_URL: ${{ github.ref == 'refs/heads/main' && 'https://app.showrium.com' || 'https://preview.showrium.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        working-directory: apps/web
        run: pnpm exec wrangler d1 migrations apply "$D1_NAME" --remote --env "$TARGET"
      - name: Build
        working-directory: apps/web
        run: pnpm exec vite build
        env:
          CLOUDFLARE_ENV: ${{ env.TARGET }}
      - name: Deploy
        working-directory: apps/web
        run: pnpm exec wrangler deploy
      - name: Smoke test
        run: curl --fail --silent --retry 3 --retry-delay 5 "$APP_URL/api/v1/health"
      # The admin app (admin.showrium.com, admin-preview.showrium.com): its own Worker on the same
      # database. Closed until Cloudflare Access is set up (it refuses every request without Access).
      - name: Build admin app
        working-directory: apps/admin
        run: pnpm exec vite build
        env:
          CLOUDFLARE_ENV: ${{ env.TARGET }}
      - name: Deploy admin app
        working-directory: apps/admin
        run: pnpm exec wrangler deploy
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Free gitleaks CLI; the gitleaks GitHub Action needs a paid licence for organizations.
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose
