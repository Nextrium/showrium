name: CLA
# Every outside contributor signs the Contributor License Agreement (CLA.md) once, by commenting
# on their pull request. Signatures are stored on the unprotected `cla-signatures` branch, so the
# protected develop/main branches are never written to. The action never checks out pull request
# code (it only reads comments and writes the signature file), which is why pull_request_target is safe here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla-v1.json
          path-to-document: https://github.com/Nextrium/showrium/blob/develop/CLA.md
          branch: cla-signatures
          # Nextrium staff and bots don't sign (Nextrium already owns its staff's work).
          allowlist: Basrahtop,basrahtop,dependabot[bot],github-actions[bot],*[bot]
